version: '3'
services:
  imageCompressorDb:
    image: postgres:latest
    container_name: image_compressor
    environment:
      POSTGRES_DB: image_compressor_db
      POSTGRES_USER: image_compressor_user
      POSTGRES_PASSWORD: image_compressor_password
    ports:
      - "5432:5432"
    volumes:
      - image_compressor_data:/var/lib/postgresql/data
  
  redis:
    image: "redis:latest"
    command: redis-server --requirepass toor
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
  
  minio:
    image: minio/minio
    container_name: minio
    ports:
      - "9000:9000" 
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
  
volumes:
  image_compressor_data:
  redis_data:
  minio_data: