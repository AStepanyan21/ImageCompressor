services:
  imageCompressorDb:
    image: postgres:17
    container_name: image_compressor
    environment:
      POSTGRES_DB: image_compressor_db
      POSTGRES_USER: image_compressor_user
      POSTGRES_PASSWORD: image_compressor_password
    ports:
      - "5432:5432"
    volumes:
      - image_compressor_data:/var/lib/postgresql/data
  
  redis:
    image: redis:latest
    command: redis-server --requirepass toor
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
  
  minio:
    image: coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    # The image has no curl/wget, so readiness is checked with the bundled mc client.
    healthcheck:
      test: ["CMD-SHELL", "mc alias set healthcheck http://localhost:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" >/dev/null && mc ready healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Bucket setup is done by scripts/minio-init.sh (see AGENTS.md).

volumes:
  image_compressor_data:
  redis_data:
  minio_data:
